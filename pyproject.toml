[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "flake8-inheritance"
description = "Flake8 plugin enforcing composition over inheritance"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.11"
authors = [
    { name = "Steven Cutting" },
]
keywords = ["flake8", "linter", "inheritance", "composition"]
classifiers = [
    "Framework :: Flake8",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "flake8>=6.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/steven-cutting/flake8-inheritance"
Changelog = "https://github.com/steven-cutting/flake8-inheritance/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/steven-cutting/flake8-inheritance/issues"
Source = "https://github.com/steven-cutting/flake8-inheritance"

[project.entry-points."flake8.extension"]
INH = "flake8_inheritance.checker:InheritanceChecker"

[project.optional-dependencies]
test = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "coverage>=7.6",
    "pytest-flake8-path>=1.5",
]
dev = [
    "flake8-inheritance[test]",
    "ruff>=0.6.9",
    "mypy>=1.11",
    "pymarkdownlnt>=0.9.17",
]

[dependency-groups]
dev = [
    "pre-commit",
    "ipython",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--disable-warnings"]
timeout = 5

[tool.coverage.run]
branch = true
source = ["flake8_inheritance"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # missing-trailing-comma (conflicts with formatter)
    "D203",    # one-blank-line-before-class (incompatible with D211)
    "D213",    # multi-line-summary-second-line (incompatible with D212)
    "ISC001",  # single-line-implicit-string-concatenation (conflicts with formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D",       # docstring rules relaxed in tests
    "S101",    # assert allowed in tests
    "ANN",     # annotations not required in tests
    "SLF001",  # private member access allowed in tests
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "flake8.*"
ignore_missing_imports = true

[tool.codespell]
ignore-words-list = "INH"

[tool.typos.default.extend-words]
INH = "INH"
